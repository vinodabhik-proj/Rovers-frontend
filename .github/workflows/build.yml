name: Build and Test Frontend

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm ci
        working-directory: .
      - name: Run tests
        run: npm test
        working-directory: .
      - name: Build
        run: npm run build
        working-directory: rovers-frontend